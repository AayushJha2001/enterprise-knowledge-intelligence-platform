[project]
name = "ekip"
version = "0.1.0"
description = "Enterprise Knowledge Intelligence Platform: RAG over enterprise documents with access control, citations and evaluation."
requires-python = ">=3.12"

# Dependencies live in requirements.txt / requirements-dev.txt so Docker can
# cache the install layer separately from the source code.

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
