name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ekip
          POSTGRES_PASSWORD: ekip
          POSTGRES_DB: ekip
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ekip -d ekip"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://ekip:ekip@localhost:5432/ekip
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Apply migrations
        run: alembic upgrade head

      - name: Test
        run: pytest

      - name: Check migrations downgrade cleanly
        run: alembic downgrade base && alembic upgrade head

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build --target prod -t ekip-api:ci .

  # Quality gate: run the full stack with the real embedding model and reranker, ingest
  # the sample corpus, and fail if retrieval or answer metrics drop below
  # evals/thresholds.json. Uses the free offline answer generator (no API key needed).
  eval:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Start the stack
        run: docker compose up -d --build

      - name: Wait for the API (first start downloads the models)
        run: |
          for i in $(seq 1 120); do
            curl -fs http://localhost:8000/health/ready && exit 0
            sleep 5
          done
          docker compose logs api worker
          exit 1

      - name: Create demo users
        run: docker compose exec -T api python -m app.cli seed-demo

      - name: Evaluate
        run: python -m evals.run --setup --check evals/thresholds.json

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: evals/reports/

      - name: Service logs
        if: failure()
        run: docker compose logs --tail 200
